name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/services/platform-api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: platform/services/platform-api/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  python-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            './platform/services/intelligence-worker[test]' \
            'PyYAML==6.0.3'
      - name: Test intelligence worker
        working-directory: platform/services/intelligence-worker
        run: python -m pytest -q
      - name: Validate contracts and SDDs
        run: python ops/validate-repository.py
