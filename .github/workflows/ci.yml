name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/services/platform-api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: platform/services/platform-api/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  python-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: platform/services/intelligence-worker/uv.lock
      - name: Install test dependencies
        working-directory: platform/services/intelligence-worker
        run: uv sync --extra test --frozen
      - name: Test intelligence worker
        working-directory: platform/services/intelligence-worker
        run: uv run --frozen pytest -q
      - name: Validate contracts and SDDs
        run: python ops/validate-repository.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: platform/apps/web/package-lock.json
      - run: cp .env.example .env.local
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
