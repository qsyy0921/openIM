openapi: 3.1.0
info:
  title: OpenIM Intelligent Collaboration Platform API
  version: 0.1.0
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Process is ready to accept requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/im/session:
    post:
      operationId: createIMSession
      security:
        - oidcBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIMSessionRequest"
      responses:
        "200":
          description: OpenIM session material for the authenticated member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateIMSessionResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /v1/im/devices:
    get:
      operationId: listMemberDevices
      security:
        - oidcBearer: []
      parameters:
        - in: query
          name: platform_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 11
            not: { const: 10 }
        - in: query
          name: device_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Safe member-owned enrollment and platform-online projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSnapshot"
        "400": { "$ref": "#/components/responses/ErrorResponse" }
        "401": { "$ref": "#/components/responses/ErrorResponse" }
        "403": { "$ref": "#/components/responses/ErrorResponse" }
        "409": { "$ref": "#/components/responses/ErrorResponse" }
        "502": { "$ref": "#/components/responses/ErrorResponse" }
        "500": { "$ref": "#/components/responses/ErrorResponse" }
  /v1/im/platforms/{platform_id}/logout:
    post:
      operationId: logoutMemberPlatform
      security:
        - oidcBearer: []
      parameters:
        - in: path
          name: platform_id
          required: true
          description: Another enrolled OpenIM platform to log out.
          schema:
            type: integer
            minimum: 1
            maximum: 11
            not: { const: 10 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutPlatformRequest"
      responses:
        "200":
          description: The target platform has been logged out by OpenIM.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutPlatformResponse"
        "400": { "$ref": "#/components/responses/ErrorResponse" }
        "401": { "$ref": "#/components/responses/ErrorResponse" }
        "403": { "$ref": "#/components/responses/ErrorResponse" }
        "409": { "$ref": "#/components/responses/ErrorResponse" }
        "502": { "$ref": "#/components/responses/ErrorResponse" }
        "500": { "$ref": "#/components/responses/ErrorResponse" }
  /v1/agent/intents/{intent_id}/approve:
    post:
      operationId: approveAgentIntent
      security:
        - oidcBearer: []
      parameters:
        - in: path
          name: intent_id
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveIntentRequest"
      responses:
        "202":
          description: Approval was recorded and execution was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveIntentResponse"
        "400": { "$ref": "#/components/responses/ErrorResponse" }
        "401": { "$ref": "#/components/responses/ErrorResponse" }
        "403": { "$ref": "#/components/responses/ErrorResponse" }
        "409": { "$ref": "#/components/responses/ErrorResponse" }
        "500": { "$ref": "#/components/responses/ErrorResponse" }
  /v1/agent/workspace:
    get:
      operationId: getAgentWorkspace
      security:
        - oidcBearer: []
      parameters:
        - in: query
          name: platform_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 11
            not: { const: 10 }
        - in: query
          name: device_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Authenticated member Agent workspace projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentWorkspace"
        "400": { "$ref": "#/components/responses/ErrorResponse" }
        "401": { "$ref": "#/components/responses/ErrorResponse" }
        "403": { "$ref": "#/components/responses/ErrorResponse" }
        "502": { "$ref": "#/components/responses/ErrorResponse" }
  /v1/agents:
    get:
      operationId: listAgents
      security:
        - oidcBearer: []
      parameters:
        - in: query
          name: platform_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 11
            not: { const: 10 }
        - in: query
          name: device_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Active tenant Agent definitions and their pinned production release metadata.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items: { "$ref": "#/components/schemas/AgentSummary" }
        "400": { "$ref": "#/components/responses/ErrorResponse" }
        "401": { "$ref": "#/components/responses/ErrorResponse" }
        "403": { "$ref": "#/components/responses/ErrorResponse" }
        "502": { "$ref": "#/components/responses/ErrorResponse" }
  /v1/agent/channels/telegram/link:
    get:
      operationId: getTelegramLinkStatus
      security:
        - oidcBearer: []
      parameters:
        - in: query
          name: platform_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 11
            not: { const: 10 }
        - in: query
          name: device_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Member-owned Telegram binding status without raw Telegram identifiers.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/TelegramLinkStatus" }
        "400": { "$ref": "#/components/responses/ErrorResponse" }
        "401": { "$ref": "#/components/responses/ErrorResponse" }
        "403": { "$ref": "#/components/responses/ErrorResponse" }
        "503": { "$ref": "#/components/responses/ErrorResponse" }
        "500": { "$ref": "#/components/responses/ErrorResponse" }
  /v1/agent/channels/telegram/link-challenges:
    post:
      operationId: issueTelegramLinkChallenge
      description: Creates a challenge with no request body; tenant and member identity come only from the authenticated device context.
      security:
        - oidcBearer: []
      parameters:
        - in: query
          name: platform_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 11
            not: { const: 10 }
        - in: query
          name: device_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "201":
          description: A new one-time Telegram link challenge. Plaintext is returned only in this response.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/TelegramLinkChallenge" }
        "400": { "$ref": "#/components/responses/ErrorResponse" }
        "401": { "$ref": "#/components/responses/ErrorResponse" }
        "403": { "$ref": "#/components/responses/ErrorResponse" }
        "409": { "$ref": "#/components/responses/ErrorResponse" }
        "429": { "$ref": "#/components/responses/ErrorResponse" }
        "503": { "$ref": "#/components/responses/ErrorResponse" }
        "500": { "$ref": "#/components/responses/ErrorResponse" }
components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ErrorResponse:
      description: Typed request failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ready
        service:
          type: string
          const: platform-api
        version:
          type: string
          minLength: 1
    CreateIMSessionRequest:
      type: object
      additionalProperties: false
      required: [platform_id, device_id]
      properties:
        platform_id:
          type: integer
          minimum: 1
          maximum: 11
          not:
            const: 10
        device_id:
          type: string
          minLength: 1
          maxLength: 128
    CreateIMSessionResponse:
      type: object
      additionalProperties: false
      required: [user_id, ws_url, user_token, expires_at]
      properties:
        user_id:
          type: string
          minLength: 1
        ws_url:
          type: string
          format: uri
        user_token:
          type: string
          minLength: 1
        expires_at:
          type: string
          format: date-time
    DeviceSnapshot:
      type: object
      additionalProperties: false
      required: [devices, online_platform_ids]
      properties:
        devices:
          type: array
          items: { "$ref": "#/components/schemas/MemberDevice" }
        online_platform_ids:
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 11
            not: { const: 10 }
    MemberDevice:
      type: object
      additionalProperties: false
      required: [device_id, platform_id, status, created_at, updated_at, current, online]
      properties:
        device_id: { type: string, minLength: 1, maxLength: 128 }
        platform_id:
          type: integer
          minimum: 1
          maximum: 11
          not: { const: 10 }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        current: { type: boolean }
        online:
          type: boolean
          description: Platform-level OpenIM online state, not per-device activity.
    LogoutPlatformRequest:
      type: object
      additionalProperties: false
      required: [current_platform_id, current_device_id]
      properties:
        current_platform_id:
          type: integer
          minimum: 1
          maximum: 11
          not: { const: 10 }
        current_device_id: { type: string, minLength: 1, maxLength: 128 }
    LogoutPlatformResponse:
      type: object
      additionalProperties: false
      required: [platform_id, state, correlation_id]
      properties:
        platform_id:
          type: integer
          minimum: 1
          maximum: 11
          not: { const: 10 }
        state: { type: string, const: logged_out }
        correlation_id: { type: string, minLength: 1 }
    ApproveIntentRequest:
      type: object
      additionalProperties: false
      required: [platform_id, device_id, payload_digest]
      properties:
        platform_id:
          type: integer
          minimum: 1
          maximum: 11
          not: { const: 10 }
        device_id:
          type: string
          minLength: 1
          maxLength: 128
        payload_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
    ApproveIntentResponse:
      type: object
      additionalProperties: false
      required: [intent_id, execution_id, state]
      properties:
        intent_id: { type: string, minLength: 1 }
        execution_id: { type: string, minLength: 1 }
        state: { type: string, enum: [queued, running, unknown, succeeded, failed] }
    AgentWorkspace:
      type: object
      additionalProperties: false
      required: [agent_user_id, runs]
      properties:
        agent_user_id: { type: string, minLength: 1 }
        runs:
          type: array
          maxItems: 30
          items: { "$ref": "#/components/schemas/AgentRun" }
    AgentSummary:
      type: object
      additionalProperties: false
      required: [agent_id, slug, display_name, description, trigger_alias, production_version_number, production_version_id, spec_checksum, bot_user_id]
      properties:
        agent_id: { type: string, minLength: 1 }
        slug: { type: string, pattern: "^[a-z][a-z0-9-]{0,62}$" }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        trigger_alias: { type: string, pattern: "^@[a-z][a-z0-9_-]{0,62}$" }
        production_version_number: { type: integer, minimum: 1 }
        production_version_id: { type: string, minLength: 1 }
        spec_checksum: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        bot_user_id: { type: string, minLength: 1 }
    AgentRun:
      type: object
      additionalProperties: false
      required: [run_id, agent_id, agent_display_name, agent_version_number, agent_spec_checksum, conversation_id, prompt, state, created_at, updated_at, citations]
      properties:
        run_id: { type: string, minLength: 1 }
        agent_id: { type: string, minLength: 1 }
        agent_display_name: { type: string, minLength: 1, maxLength: 120 }
        agent_version_number: { type: integer, minimum: 1 }
        agent_spec_checksum: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        conversation_id: { type: string, minLength: 1 }
        prompt: { type: string }
        state: { type: string, enum: [queued, running, reply_pending, waiting_approval, succeeded, failed] }
        answer: { type: string }
        model: { type: string }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        citations:
          type: array
          items: { "$ref": "#/components/schemas/AgentCitation" }
        intent: { "$ref": "#/components/schemas/AgentIntent" }
    AgentCitation:
      type: object
      additionalProperties: false
      required: [citation_id, title, source_uri, checksum]
      properties:
        citation_id: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        source_uri: { type: string, minLength: 1 }
        checksum: { type: string, minLength: 1 }
    AgentIntent:
      type: object
      additionalProperties: false
      required: [intent_id, action_type, title, payload_digest, state, expires_at]
      properties:
        intent_id: { type: string, minLength: 1 }
        action_type: { type: string, const: create_ticket }
        title: { type: string, minLength: 1, maxLength: 200 }
        payload_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        state: { type: string, enum: [pending_approval, approved, executing, succeeded, failed, expired] }
        expires_at: { type: string, format: date-time }
        execution_id: { type: string }
        execution_state: { type: string, enum: [queued, running, unknown, succeeded, failed] }
        ticket_id: { type: string }
    TelegramLinkStatus:
      oneOf:
        - type: object
          additionalProperties: false
          required: [state]
          properties:
            state: { type: string, const: unbound }
        - type: object
          additionalProperties: false
          required: [state, expires_at]
          properties:
            state: { type: string, const: pending }
            expires_at: { type: string, format: date-time }
        - type: object
          additionalProperties: false
          required: [state]
          properties:
            state: { type: string, const: bound }
    TelegramLinkChallenge:
      type: object
      additionalProperties: false
      required: [state, code, command, expires_at]
      properties:
        state: { type: string, const: pending }
        code:
          type: string
          pattern: "^(?:[A-Z2-7]{4}-){7}[A-Z2-7]{4}$"
        command:
          type: string
          pattern: "^/link (?:[A-Z2-7]{4}-){7}[A-Z2-7]{4}$"
        expires_at: { type: string, format: date-time }
    Error:
      type: object
      additionalProperties: false
      required: [code, message, retryable, correlation_id]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        retryable:
          type: boolean
        correlation_id:
          type: string
          minLength: 1
