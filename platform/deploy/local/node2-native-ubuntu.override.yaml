services:
  keycloak:
    ports: !override
      - "127.0.0.1:18081:8080"
    environment:
      KC_HOSTNAME: "https://${PLATFORM_NODE2_PUBLIC_HOST:?required}:3443/auth"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_PROXY_HEADERS: "xforwarded"
