global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:19091"]

  - job_name: openim-platform-api
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:18080"]

  - job_name: openim-intelligence-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:18082"]
