services:
  kafka:
    ports:
      - "127.0.0.1:19094:9095"
    environment:
      KAFKA_CFG_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094,HOST://:9095"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://kafka:9094,HOST://127.0.0.1:19094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT"

  minio:
    ports:
      - "12005:9000"

  openim-server:
    ports:
      - "12001:10001"
      - "12002:10002"

  openim-chat:
    ports:
      - "12008:10008"
      - "12009:10009"
