services:
  mongo:
    volumes:
      - openim-local-mongo-data:/data/db
      - openim-local-mongo-logs:/data/logs

  redis:
    volumes:
      - openim-local-redis-data:/data

  etcd:
    volumes:
      - openim-local-etcd-data:/etcd-data

  kafka:
    ports:
      - "127.0.0.1:19094:9095"
    environment:
      KAFKA_CFG_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094,HOST://:9095"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://kafka:9094,HOST://127.0.0.1:19094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT"
    volumes:
      - openim-local-kafka-data:/bitnami/kafka

  minio:
    volumes:
      - openim-local-minio-data:/data
      - openim-local-minio-config:/root/.minio

  openim-server:
    healthcheck:
      test:
        - CMD-SHELL
        - "test $$(pgrep -f '/openim-server/_output/bin/platforms/linux/amd64/openim-' | wc -l) -ge 26"
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  openim-chat:
    healthcheck:
      test:
        - CMD-SHELL
        - "test $$(pgrep -f '/openim-chat/_output/bin/platforms/linux/amd64/(chat|admin)-' | wc -l) -ge 4"
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  openim-local-mongo-data:
  openim-local-mongo-logs:
  openim-local-redis-data:
  openim-local-etcd-data:
  openim-local-kafka-data:
  openim-local-minio-data:
  openim-local-minio-config:
