map $http_upgrade $openim_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    return 308 https://$host:3443$request_uri;
}

server {
    listen 3443 ssl;
    listen [::]:3443 ssl;
    server_name _;

    ssl_certificate /etc/openim-platform/tls/node2.crt;
    ssl_certificate_key /etc/openim-platform/tls/node2.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OpenIMTLS:10m;
    ssl_session_timeout 1d;

    root /srv/openim-platform/web/current;
    index index.html;
    client_max_body_size 128m;

    location /auth/ {
        proxy_pass http://127.0.0.1:18081/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 3443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /platform-api/ {
        proxy_pass http://127.0.0.1:18080/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /openim-api/ {
        proxy_pass http://127.0.0.1:12002/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /openim-ws {
        proxy_pass http://127.0.0.1:12001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $openim_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
