[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openim-intelligence-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.136.0",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "prometheus-client==0.25.0",
  "uvicorn==0.44.0",
]

[project.scripts]
openim-agent-routing-eval = "intelligence_worker.evaluation:main"

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
